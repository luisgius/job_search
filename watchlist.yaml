# ---------------------------------------------------------------------------
# What to search.  Verify any slug before trusting it:
#     python -m src.sources.ats_boards --check greenhouse spotify
#     python -m src.sources.ats_boards --check personio acme
#     python -m src.sources.ats_boards --check-all        # everything below
#
# START FROM A COMPANY NAME instead, and let the tool find the board:
#     python -m src.sources.ats_boards --discover "Glovo" "Factorial HR"
#
# It derives the plausible slug spellings from each name, asks the eight boards,
# and prints the lines to paste here — plus what it asked and what answered, so
# you can disagree with it. It never edits this file: this is the one you
# curate by hand, and a tool that rewrites it will eventually eat something.
#
# When you paste, MERGE into any key this file already has. Two `greenhouse:`
# blocks would make YAML keep only the last one — silently dropping every
# company under the first — so the loader refuses a file with a duplicated
# key and names it, instead of quietly losing boards from the daily run.
#
# Read the confidence rather than the suggestion. `high` means one board
# answered with real postings and nothing qualified it. Anything else is
# printed COMMENTED OUT on purpose — two boards answering (a slug shared with a
# different company), a board that exists with nothing open, a board that never
# answered — because a wrong slug in here is worse than no slug: it returns
# nothing every morning and looks exactly like a quiet market.
#
# It is also the only part of this tool that makes requests to boards nobody
# told it about, so it is bounded: at most 4 spellings per board/company and
# 160 probes a run; Personio host fallback can add a second HTTP request.
# It stops after the round where a board answers with postings, and reports
# what each bound dropped. Raise `--max-requests` deliberately —
# traffic that looks like a scanner gets you blocked from the boards the daily
# run actually needs.
#
# Finding a slug by hand: open a company's careers page and look at the job
# link. The slug is the path segment (or, for Personio, the subdomain) — never
# the company's display name.
#
#   boards.greenhouse.io/SLUG/jobs/123        -> greenhouse:      SLUG
#   jobs.lever.co/SLUG/uuid                   -> lever:           SLUG
#   apply.workable.com/SLUG/j/ABC123/         -> workable:        SLUG
#   jobs.ashbyhq.com/SLUG/uuid                -> ashby:           SLUG
#   jobs.smartrecruiters.com/SLUG/74399...    -> smartrecruiters: SLUG
#   SLUG.jobs.personio.de/job/12345           -> personio:        SLUG
#
# Pasting the whole URL works too — it is reduced to the slug for you.
#
# WHICH ONE IS A COMPANY ON?  `--discover` answers this for most companies.
# Otherwise: open their careers page and look at where the "Apply" link goes.
# Greenhouse and Lever are where American companies post; Workable, Ashby,
# SmartRecruiters and Personio are where European ones do, and Personio in
# particular is the default for German, Spanish and Italian SMBs.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PHASE 3 — VERIFIED (round 1: your --check-all run of 2026-09-01, 71 probes).
# Every ACTIVE line below answered that run with a real board; the per-line
# comment carries that day's posting count. 30 candidate slugs 404'd and were
# pruned — the companies may still hire, they just are not at that address;
# the commented "next round" blocks keep the best re-guesses, inert until
# verified:
#
#     python -m src.sources.ats_boards --check greenhouse dockerinc
#     python -m src.sources.ats_boards --discover "Glovo" "DeepL" "Pleo"
#
# A company here is a search commitment, not an endorsement: one request/day.
# ---------------------------------------------------------------------------

