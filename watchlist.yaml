# ---------------------------------------------------------------------------
# The four European boards.
#
# They are switched OFF in config.yaml until you put your own companies here:
# there is no useful default list of "mid-size employers hiring in Valencia",
# and an enabled board with an empty watchlist returns nothing every morning
# while looking exactly like a quiet market. `--validate-only` says so.
#
# The examples below are each vendor's own careers board. The first live run
# (2026-09-01) verified ashby (68 postings), smartrecruiters (2) and personio
# (1); workable's own board is NOT at apply.workable.com/workable and its
# placeholder is gone. Replace them all with companies you would work for:
#
#     python -m src.sources.ats_boards --check-all
# ---------------------------------------------------------------------------

workable:
  # The vendor's own slug 404'd on the first live run. blueground answered a
  # live probe (the anchor the network tests use). Verify, then flip
  # sources.workable on in config.yaml.
  - blueground       # VERIFIED 2026-09-01 · Athens/remote · ops analytics
  - netdata          # CANDIDATE · Athens/remote · observability
  - hotjar           # CANDIDATE · Malta/remote-EU · product analytics
  - toggl            # CANDIDATE · remote-EU
  - marfeel          # CANDIDATE · Barcelona · editorial analytics

ashby:
  - ashby            # VERIFIED 2026-09-01 (68 postings) · the vendor itself
  - posthog          # CANDIDATE · remote EU · product analytics, ships fast
  - linear           # CANDIDATE · remote EU
  - supabase         # CANDIDATE · remote EU
  - deel             # CANDIDATE · remote EU · payroll DS

smartrecruiters:
  # Case-sensitive on this vendor: the slug is spelled exactly as it appears in
  # the jobs.smartrecruiters.com URL, capitals and all. NOTE: this vendor
  # answers 200-with-empty-list for slugs that do not exist (verified live
  # 2026-09-01), so a wrong slug here is INVISIBLE to --check-all — it reads
  # as "exists, nothing open". Treat persistent zeros with suspicion and
  # confirm the spelling on the company's own careers URL.
  - smartrecruiters  # VERIFIED 2026-09-01 (2 postings) · the vendor itself
  - allegro          # CANDIDATE · Warsaw/Poznań · biggest PL DS org
  - SonarSource      # CANDIDATE · Geneva · case-sensitive spelling
  - Visma            # CANDIDATE · Nordics · case-sensitive spelling

personio:
  # Bare tenant name -> {tenant}.jobs.personio.de, with an automatic retry on
  # .personio.com for the minority of tenants provisioned there. Write the full
  # host (acme.jobs.personio.com) to skip the guess.
  #
  # By default no language is requested and the feed answers in the tenant's
  # own — which for a German SMB means German ads, and that is deliberate: a
  # posting may exist ONLY in German, and asking for a language the career site
  # does not publish returns an empty or half-empty description. A job made
  # worse, or lost, to buy a translation nobody needed. Filtering and remote
  # detection read German, Spanish, French, Italian, Dutch and Polish, and the
  # scoring model is not monolingual either.
  #
  # Ask for one per tenant only when you know they publish it:
  #     - {slug: acme, language: en}     # de en fr es nl it pt
  #
  # German/Spanish SMBs are this vendor's home turf and exactly where
  # --discover earns its keep: run it with company names from your LinkedIn
  # alerts and paste what answers with postings.
  - personio         # VERIFIED 2026-09-01 (1 posting) · the vendor itself

recruitee:
  # Bare tenant name -> {tenant}.recruitee.com/api/offers/ — the public JSON
  # every Recruitee careers site serves. This is the vendor to try first for
  # Dutch and Belgian mid-size companies.
  - channable        # VERIFIED 2026-09-01 · Utrecht · feed-optimisation ML
  - bunq             # CANDIDATE · Amsterdam · fintech
  - deptagency       # CANDIDATE · Amsterdam · data consultancy

teamtailor:
  # The Nordic default. Two entry shapes:
  #     - acme                            # hosted: acme.teamtailor.com
  #     - https://careers.acme.com/jobs   # custom domain: the careers URL
  # Custom domains are the norm for this vendor's larger tenants — paste the
  # jobs page URL and the fetcher appends .rss itself and follows redirects.
  - https://career.teamtailor.com/jobs   # VERIFIED 2026-09-01 · the vendor
  - einride          # CANDIDATE · Stockholm · autonomous freight ML
  - voi              # CANDIDATE · Stockholm · micromobility ops DS
  - epidemicsound    # CANDIDATE · Stockholm · music recsys
  - oda              # CANDIDATE · Oslo · grocery forecasting

adzuna:
  # Adzuna's European coverage, lowercase: at be ch de es fr gb it nl pl.
  # It does NOT cover Portugal, Ireland or the Nordics — those come from the
  # ATS boards and your LinkedIn alerts instead.
  #
  # Indeed is deliberately not a source: it closed its public API to new users,
  # so the only route left is scraping against its terms, and it is heavily
  # defended against exactly that. Adzuna aggregates a large share of the same
  # listings across these ten countries and has an API you are allowed to use.
  countries: [es, de, nl, fr, it, at, be, ch, gb, pl]
  # Matched to cv/base_cv.md: a Data Scientist profile, so "backend" is out
  # and "machine learning" is in — as a query it catches ML Engineer and ML
  # Scientist titles both.
  queries:
    - "data scientist"
    - "machine learning"
    - "python"
  # One request per country x query, so this list multiplies. Ten countries x
  # three queries is thirty calls a run — fine for a free key, but trim the
  # countries before you add queries.
  #
  # `where` narrows to one city and needs distance_km to widen the radius.
  # Leave both out to search a whole country, which is the default here.
  #   where: "Valencia"
  #   distance_km: 25      # reaches Paterna, Burjassot, Torrent, Sagunto
  max_days_old: 1          # Adzuna's own freshness filter
  results_per_page: 50

linkedin_email:
  # Create daily job alerts in LinkedIn, then let the pipeline read them.
  gmail_query: "from:jobalerts-noreply@linkedin.com newer_than:2d"
  max_messages: 25
  credentials_file: gmail_credentials.json
  token_file: gmail_token.json
  fetch_descriptions: true
