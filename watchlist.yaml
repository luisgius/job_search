# ---------------------------------------------------------------------------
# What to search.  Verify any slug before trusting it:
#     python -m src.sources.ats_boards --check greenhouse spotify
#     python -m src.sources.ats_boards --check personio acme
#     python -m src.sources.ats_boards --check-all        # everything below
#
# START FROM A COMPANY NAME instead, and let the tool find the board:
#     python -m src.sources.ats_boards --discover "Glovo" "Factorial HR"
#
# It derives the plausible slug spellings from each name, asks the eight boards,
# and prints the lines to paste here — plus what it asked and what answered, so
# you can disagree with it. It never edits this file: this is the one you
# curate by hand, and a tool that rewrites it will eventually eat something.
#
# When you paste, MERGE into any key this file already has. Two `greenhouse:`
# blocks would make YAML keep only the last one — silently dropping every
# company under the first — so the loader refuses a file with a duplicated
# key and names it, instead of quietly losing boards from the daily run.
#
# Read the confidence rather than the suggestion. `high` means one board
# answered with real postings and nothing qualified it. Anything else is
# printed COMMENTED OUT on purpose — two boards answering (a slug shared with a
# different company), a board that exists with nothing open, a board that never
# answered — because a wrong slug in here is worse than no slug: it returns
# nothing every morning and looks exactly like a quiet market.
#
# It is also the only part of this tool that makes requests to boards nobody
# told it about, so it is bounded: at most 4 spellings per company and 120
# requests a run, it stops as soon as a board answers with postings, and it
# says out loud what each bound dropped. Raise `--max-requests` deliberately —
# traffic that looks like a scanner gets you blocked from the boards the daily
# run actually needs.
#
# Finding a slug by hand: open a company's careers page and look at the job
# link. The slug is the path segment (or, for Personio, the subdomain) — never
# the company's display name.
#
#   boards.greenhouse.io/SLUG/jobs/123        -> greenhouse:      SLUG
#   jobs.lever.co/SLUG/uuid                   -> lever:           SLUG
#   apply.workable.com/SLUG/j/ABC123/         -> workable:        SLUG
#   jobs.ashbyhq.com/SLUG/uuid                -> ashby:           SLUG
#   jobs.smartrecruiters.com/SLUG/74399...    -> smartrecruiters: SLUG
#   SLUG.jobs.personio.de/job/12345           -> personio:        SLUG
#
# Pasting the whole URL works too — it is reduced to the slug for you.
#
# WHICH ONE IS A COMPANY ON?  `--discover` answers this for most companies.
# Otherwise: open their careers page and look at where the "Apply" link goes.
# Greenhouse and Lever are where American companies post; Workable, Ashby,
# SmartRecruiters and Personio are where European ones do, and Personio in
# particular is the default for German, Spanish and Italian SMBs.
# ---------------------------------------------------------------------------

greenhouse:
  # Replace with the companies you actually want. These are only examples and
  # slugs do change — run --check-all after editing. spotify was here until
  # 2026-09-01, when the first live run answered 404: they left Greenhouse.
  # datadog (455 postings) and gitlab (221) verified live the same day.
  - datadog
  - gitlab

lever:
  # plaid 404'd on the first live run (2026-09-01) — they left Lever. Empty
  # until Phase 3 verifies real tenants; sources.lever is off in config.yaml
  # for the same reason (an enabled board over an empty list reads as a
  # quiet market).
  []

# ---------------------------------------------------------------------------
# The four European boards.
#
# They are switched OFF in config.yaml until you put your own companies here:
# there is no useful default list of "mid-size employers hiring in Valencia",
# and an enabled board with an empty watchlist returns nothing every morning
# while looking exactly like a quiet market. `--validate-only` says so.
#
# The examples below are each vendor's own careers board. The first live run
# (2026-09-01) verified ashby (68 postings), smartrecruiters (2) and personio
# (1); workable's own board is NOT at apply.workable.com/workable and its
# placeholder is gone. Replace them all with companies you would work for:
#
#     python -m src.sources.ats_boards --check-all
# ---------------------------------------------------------------------------

workable:
  # The vendor's own slug 404'd on the first live run — add real tenants
  # before enabling this board (Greek mid-size tech is its home turf).
  []

ashby:
  - ashby

smartrecruiters:
  # Case-sensitive on this vendor: the slug is spelled exactly as it appears in
  # the jobs.smartrecruiters.com URL, capitals and all.
  - smartrecruiters

personio:
  # Bare tenant name -> {tenant}.jobs.personio.de, with an automatic retry on
  # .personio.com for the minority of tenants provisioned there. Write the full
  # host (acme.jobs.personio.com) to skip the guess.
  #
  # By default no language is requested and the feed answers in the tenant's
  # own — which for a German SMB means German ads, and that is deliberate: a
  # posting may exist ONLY in German, and asking for a language the career site
  # does not publish returns an empty or half-empty description. A job made
  # worse, or lost, to buy a translation nobody needed. Filtering and remote
  # detection read German, Spanish, French, Italian, Dutch and Polish, and the
  # scoring model is not monolingual either.
  #
  # Ask for one per tenant only when you know they publish it:
  #     - {slug: acme, language: en}     # de en fr es nl it pt
  - personio

recruitee:
  # Bare tenant name -> {tenant}.recruitee.com/api/offers/ — the public JSON
  # every Recruitee careers site serves. This is the vendor to try first for
  # Dutch and Belgian mid-size companies.
  #     - acme
  []

teamtailor:
  # The Nordic default. Two entry shapes:
  #     - acme                            # hosted: acme.teamtailor.com
  #     - https://careers.acme.com/jobs   # custom domain: the careers URL
  # Custom domains are the norm for this vendor's larger tenants — paste the
  # jobs page URL and the fetcher appends .rss itself and follows redirects.
  []

adzuna:
  # Adzuna's European coverage, lowercase: at be ch de es fr gb it nl pl.
  # It does NOT cover Portugal, Ireland or the Nordics — those come from the
  # ATS boards and your LinkedIn alerts instead.
  #
  # Indeed is deliberately not a source: it closed its public API to new users,
  # so the only route left is scraping against its terms, and it is heavily
  # defended against exactly that. Adzuna aggregates a large share of the same
  # listings across these ten countries and has an API you are allowed to use.
  countries: [es, de, nl, fr, it, at, be, ch, gb, pl]
  # Matched to cv/base_cv.md: a Data Scientist profile, so "backend" is out
  # and "machine learning" is in — as a query it catches ML Engineer and ML
  # Scientist titles both.
  queries:
    - "data scientist"
    - "machine learning"
    - "python"
  # One request per country x query, so this list multiplies. Ten countries x
  # three queries is thirty calls a run — fine for a free key, but trim the
  # countries before you add queries.
  #
  # `where` narrows to one city and needs distance_km to widen the radius.
  # Leave both out to search a whole country, which is the default here.
  #   where: "Valencia"
  #   distance_km: 25      # reaches Paterna, Burjassot, Torrent, Sagunto
  max_days_old: 1          # Adzuna's own freshness filter
  results_per_page: 50

linkedin_email:
  # Create daily job alerts in LinkedIn, then let the pipeline read them.
  gmail_query: "from:jobalerts-noreply@linkedin.com newer_than:2d"
  max_messages: 25
  credentials_file: gmail_credentials.json
  token_file: gmail_token.json
  fetch_descriptions: true
