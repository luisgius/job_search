  # --- remote-EU first ---
  - datadog          # VERIFIED 2026-09-01 · 449 postings · heavy DS org
  - gitlab           # VERIFIED 2026-09-01 · 224 · all-remote, EMEA-friendly
  - elastic          # VERIFIED 2026-09-01 · 345 · ML search/observability
  - canonical        # VERIFIED 2026-09-01 · 302 · all-remote EU
  - grafanalabs      # VERIFIED 2026-09-01 · 134 · remote EMEA
  # remotecom removed 2026-10-23: HTTP 404 since mid-October. --discover found
  # no new board; greenhouse/remote is an unrelated New York company.
  # --- Netherlands ---
  - adyen            # VERIFIED 2026-09-01 · 222 · payments DS/risk ML
  # --- Spain ---
  - cabify           # VERIFIED 2026-09-01 · 66 · Madrid marketplace
  - typeform         # VERIFIED 2026-09-01 · 12 · Barcelona
  # --- Ireland ---
