  - n26              # VERIFIED 2026-09-01 · 58 · fintech risk ML
  - getyourguide     # VERIFIED 2026-09-01 · 55 · marketplace ranking
  - celonis          # VERIFIED 2026-09-01 · 278 · process mining ML
  # traderepublic answers but has been empty since late September; the live
