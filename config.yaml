# ---------------------------------------------------------------------------
# Job Hunter — settings.  What to *search for* lives in watchlist.yaml.
# Every key here is optional; anything you omit falls back to src/config.py.
# ---------------------------------------------------------------------------

applicant:
  name: ""                 # REQUIRED — "Ada Lovelace"
  email: ""                # REQUIRED — used on application forms
  phone: ""                # REQUIRED before you turn dry_run off
  location: ""             # "Berlin, Germany"
  linkedin: ""             # "https://www.linkedin.com/in/you"
  github: ""
  website: ""

llm:
  # "anthropic" talks to the SDK directly.
  # "openrouter" speaks the OpenAI chat-completions dialect over plain HTTP —
  # which also covers any other OpenAI-compatible gateway (LiteLLM, a local
  # vLLM, a corporate proxy) by setting base_url below.
  provider: anthropic
  base_url: ""             # only for a non-OpenRouter compatible gateway

keys:
  # Environment variables ALWAYS win over anything written here, so you can
  # leave these blank and export the key instead. Only the key belonging to
  # llm.provider is used — the others are ignored.
  anthropic: ""            # or env ANTHROPIC_API_KEY
  openrouter: ""           # or env OPENROUTER_API_KEY
  adzuna_app_id: ""        # or env ADZUNA_APP_ID
  adzuna_app_key: ""       # or env ADZUNA_APP_KEY

sources:
  greenhouse: true
  lever: true
  adzuna: false            # needs free keys from developer.adzuna.com
  linkedin_email: false    # needs gmail_credentials.json (see README)

freshness:
  max_age_hours: 24
  # Postings with no trustworthy date can't be proven fresh. Dropping them is
  # the honest default — set false to keep them and accept some staleness.
  skip_undated: true

filters:
  # ISO-3166 alpha-2. Trim this to the countries you can actually work in.
  countries: [DE, NL, ES, FR, IE, PT, SE, DK, FI, NO, PL, AT, BE, IT, CH, CZ, GB]
  allow_remote: true
  # "Remote" with no European hint anywhere is usually a US role.
  remote_requires_eu_hint: true

  # Empty = allow any title. Whole-word, case-insensitive matching.
  title_include: []
  # This list REPLACES the shipped defaults rather than adding to them, so it
  # spells them all out. There is no stemming — "intern" does not catch
  # "internships" — and an EU search is not an English-language search, so the
  # entry-level words every local board uses are listed too. Whole-word
  # matching is what makes that safe: "intern" cannot hit "International",
  # "stage" cannot hit "Backstage".
  title_exclude:
    - intern
    - interns
    - internship
    - internships
    - apprentice
    - apprentices
    - apprenticeship
    - apprenticeships
    - graduate program
    - graduate programs
    - graduate programme
    - graduate programmes
    - graduate scheme
    - graduate schemes
    - working student
    - volunteer
    # German
    - werkstudent
    - praktikum
    - praktikant
    - praktikantin
    - ausbildung
    - auszubildende
    - azubi
    - duales studium
    # French
    - stage
    - stagiaire
    - alternance
    - alternant
    - apprentissage
    # Spanish / Portuguese
    - becario
    - becaria
    - practicas
    - estagio
    - estagiario
    # Dutch
    - stagiair
    - afstudeerstage
    # Polish
    - praktyki
    - praktykant
    - staz
    - stazysta
    # Italian
    - tirocinio
    - stagista
  description_exclude:
    - security clearance
    - must be a us citizen
  # Read only from what the board states as structured data — Lever's
  # categories.commitment, Adzuna's contract_type — never from the title.
  # This catches the roles whose title is neutral but whose type is not.
  # `contract` and `freelance` are left OUT on purpose: plenty of real EU tech
  # work is contract, and a default that deletes jobs is the wrong kind of
  # opinionated. Uncomment them if you only want permanent roles.
  employment_type_exclude:
    - internship
    - intern
    - apprenticeship
    - apprentice
    - temporary
    - temp
    - seasonal
    - volunteer
    - work experience
    # - contract
    # - contractor
    # - freelance
  require_keywords_any: []
  min_description_chars: 0

scoring:
  # With provider: openrouter, model ids are vendor-qualified —
  # "anthropic/claude-sonnet-5", "openai/gpt-5", "google/gemini-2.5-pro".
  # A bare name is a 404 from OpenRouter; --validate-only catches that.
  model: claude-sonnet-5   # claude-haiku-4-5-20251001 is ~10x cheaper, a bit blunter
  threshold: 65            # 65 medium · 75 strict
  max_jobs: 40             # hard cap on LLM calls per run — your cost ceiling
  max_tokens: 1500
  temperature: 0.0
  concurrency: 4

tailoring:
  enabled: true
  model: claude-sonnet-5
  max_per_run: 10
  max_tokens: 4000
  temperature: 0.2

apply:
  enabled: true
  # KEEP THIS TRUE for a few days. Dry run fills the form, screenshots it to
  # output/applications/<slug>/form_filled.png, and submits nothing.
  dry_run: true
  max_per_run: 5
  min_score: 80            # deliberately stricter than scoring.threshold
  headless: true
  timeout_seconds: 60
  require_pdf: true        # no tailored PDF -> digest instead of auto-apply

output:
  dir: output
  open_browser: true

db:
  path: output/tracker.sqlite3
  # Don't re-surface a job you've already been shown within this many days.
  # Jobs you actually applied to are never surfaced again, window or not.
  skip_seen_days: 30

cv:
  path: cv/base_cv.md

notify:
  # A run that fetched nothing because every board 404'd produces the same
  # empty digest as a genuinely quiet Tuesday. This is what tells them apart.
  enabled: true
  on: [no_digest, missed_run, no_jobs, source_zero, all_sources_failed]
  channels:
    console: true          # stderr — ends up in run.log, and in cron's mail
    file: true             # output/ALERT.txt, deleted again when a run is healthy
    # Any command. Gets the message as its last argument, on stdin, and in
    # $JOBHUNTER_ALERT. Run without a shell, so job text can never be injected.
    #   macOS:  terminal-notifier -title "Job Hunter" -message
    #   Linux:  notify-send "Job Hunter"
    #   phone:  curl -d @- https://ntfy.sh/your-topic
    command: ""
    email: {}
      # to: you@example.com
      # from: you@example.com
      # smtp_host: smtp.gmail.com
      # smtp_port: 587
      # username: you@example.com
      # starttls: true
      # password comes from $JOBHUNTER_SMTP_PASSWORD, not from this file
  exit_nonzero: false      # true = a run with alerts exits 4, for schedulers

logging:
  level: INFO
