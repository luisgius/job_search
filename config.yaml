# ---------------------------------------------------------------------------
# Job Hunter — settings.  What to *search for* lives in watchlist.yaml.
# Every key here is optional; anything you omit falls back to src/config.py.
# ---------------------------------------------------------------------------

applicant:
  # Taken from cv/Luis_Gimenez_CV.pdf — the email here matches the one ON the
  # CV on purpose: the address a recruiter sees on the form and the address on
  # the attached document must be the same person.
  name: "Luis Gimenez"
  email: "lgimenezuso@gmail.com"
  # Kept OUT of this file on purpose: the repo is public and a phone number
  # in a public repo gets scraped. Set it here on your own machine — apply
  # only requires it before you turn dry_run off.
  phone: ""
  location: "Kraków, Poland"
  linkedin: "https://linkedin.com/in/luis-gimenez-uso"   # as printed on the CVs
  github: "https://github.com/luisgius"
  website: ""

llm:
  # "anthropic" talks to the SDK directly.
  # "openrouter" speaks the OpenAI chat-completions dialect over plain HTTP —
  # which also covers any other OpenAI-compatible gateway (LiteLLM, a local
  # vLLM, a corporate proxy) by setting base_url below.
  provider: openrouter
  base_url: ""             # only for a non-OpenRouter compatible gateway

keys:
  # Environment variables ALWAYS win over anything written here, so you can
  # leave these blank and export the key instead. Only the key belonging to
  # llm.provider is used — the others are ignored.
  anthropic: ""            # or env ANTHROPIC_API_KEY
  openrouter: ""           # or env OPENROUTER_API_KEY
  adzuna_app_id: ""        # or env ADZUNA_APP_ID
  adzuna_app_key: ""       # or env ADZUNA_APP_KEY

cv:
  # Three presentations of the SAME facts (cv/*.pdf are the originals, the
  # .md files are what the pipeline reads). Scoring always uses `path` — the
  # variants carry identical facts, so scoring against them would buy
  # nothing. Tailoring picks per job: first variant whose title_terms
  # whole-word-match the job title wins (same matching as filters.title_*,
  # so "ml" hits "ML Engineer" and never "HTML Developer"); no hit -> path.
  #
  # The phone number is deliberately absent from all three .md files — this
  # repo is public. Set applicant.phone on your own machine: tailoring
  # injects the contact block from `applicant`, so generated documents
  # carry it even though the committed CVs do not.
  path: cv/base_cv.md
  variants:
    - path: cv/base_cv_ml.md
      title_terms:
        - machine learning engineer
        - ml engineer
        - ml
        - mlops
        - ai engineer
        - ai
        - applied scientist
        - deep learning
        - computer vision
        - nlp
        - llm
    - path: cv/base_cv_product.md
      title_terms:
        - product
        - analytics
        - experimentation
        - insights
        - growth
        - decision scientist
        - business intelligence

sources:
  # Greenhouse and Lever are where US companies post. If you are searching in
  # Spain, Germany or Italy, the six below are where the mid-size local
  # employers actually are — turning them on is the single biggest change you
  # can make to how many relevant postings you see each morning.
  greenhouse: true
  lever: true
  # Each needs companies in watchlist.yaml first; an enabled board with an
  # empty watchlist fetches nothing and looks exactly like a quiet market
  # (--validate-only will tell you). Prove your slugs, then flip these:
  #     python -m src.sources.ats_boards --check-all
  workable: false          # EU/Greek-founded — very common for mid-size
  ashby: false             # modern start-ups
  smartrecruiters: false   # large EU employers (DE/FR/ES)
  personio: false          # the German/Spanish/Italian SMB default
  recruitee: false         # Dutch-founded — very common for NL/BE mid-size
  teamtailor: false        # the Nordic default; entries may be full careers URLs
  # The two below are *global feeds*, not watchlist boards: no companies to
  # list, no keys to create — flip them on and they fetch. Both point their
  # apply link at the board rather than the employer's ATS, so when the same
  # role arrives twice, dedupe keeps the ATS copy.
  arbeitnow: true          # German market, free API, has a visa_sponsorship flag
  landing_jobs: true       # Lisbon/Porto + remote-EU, salary published often
  # Tier 2 — no official API: these read the internal JSON the site's own
  # frontend uses, so they cover the Polish market properly (you live in it)
  # at the price of an endpoint that owes us nothing. When one breaks it
  # degrades — warning + digest error + the health "went silent" alert —
  # and never takes the run down. Both filter to data/AI, junior+mid.
  justjoin_it: true        # justjoin.it — salary on every ad
  nofluffjobs: true        # nofluffjobs.com — PL/CEE, salary on every ad
  adzuna: false            # needs free keys from developer.adzuna.com
  linkedin_email: false    # needs gmail_credentials.json (see README)

freshness:
  # 72, not 24 — and the reason is worth reading before you tighten it back.
  #
  # A narrow window feels like it keeps the digest small. It does not: that job
  # belongs to db.skip_seen_days, which already guarantees you are shown each
  # posting exactly once. Widening the window from 24h to 72h therefore does
  # NOT triple your morning digest. Yesterday's jobs are still yesterday's
  # jobs, and the tracker still suppresses them.
  #
  # What 24 hours does do is lose things, silently and permanently. A Friday
  # posting when the next run is Monday. A board that publishes in batches, or
  # a company whose HR team posts at 18:00 on a day the run happened at 08:00.
  # Adzuna's `created` is its own ingest time, not the employer's, and lags.
  # Greenhouse's `first_published` is missing often enough that the fallback
  # matters. Every one of those is a real job that never appears, with no trace
  # anywhere that it existed — which is the one failure this tool must not have.
  #
  # The premise behind 24 was "apply in the first day or you have lost". That
  # is contested: one tracked sample of 347 applications saw 12% response on
  # day one and 61% on day four, because day one is when 200+ other applicants
  # arrive at once. Speed is worth something; it is not worth silence.
  max_age_hours: 72
  # Postings with no trustworthy date can't be proven fresh. Dropping them is
  # the honest default — set false to keep them and accept some staleness.
  # Watch the `undated` count in the digest's filter breakdown for a week
  # before you decide; if one company you care about always lands there, this
  # is the switch.
  skip_undated: true

  # --- the ghost-job flag: it annotates a card, it never drops a job --------
  #
  # Somewhere between 18% and 27% of online postings are never filled, and
  # Greenhouse's own study found at least 1 in 5 US postings falls in that
  # bucket. There is exactly one signal here, and it is NOT posting age.
  #
  # Age cannot be a signal in this pipeline. Every posting you see came
  # through the max_age_hours window above, so it is younger than 72 hours by
  # construction — "flag postings older than 30 days" can never fire on
  # anything you are shown. (It shipped once anyway. It was dead code.)
  #
  # What survives is how long the *role* has been circulating, which the
  # tracker remembers even though each re-listing carries a brand new date:
  # same company, same title, same city, a different job id, seen before. A
  # role advertised for eight months is the thing worth flagging.
  #
  # A sighting only counts once it is this many days before the current
  # listing, because a healthy job reaching us twice from the SAME board in
  # one week is a duplicate, not a re-listing. (Cross-board sightings are
  # ignored outright — see docs/ARCHITECTURE.md — because an ATS migration or
  # an aggregator re-dating a live posting looks exactly like a re-listing.)
  #
  # 0 turns the flag off. It does not mean "flag everything": in this file 0
  # always disables, the same way scoring.max_jobs: 0 scores nothing.
  repost_min_gap_days: 14

filters:
  # ISO-3166 alpha-2 — the whole EU27 plus the EEA and the UK.
  # Trim it to the countries you can actually work in: every country left here
  # is one you are willing to see in the digest, and a shorter list is the
  # cheapest way to cut noise. Leaving it wide is fine if you are open to
  # relocating or the role is remote.
  countries:
    # Trimmed to where this user actually applies (Phase 4): every country
    # here needs no sponsorship for an EU citizen. GB moved out on purpose —
    # it lives in countries_if_sponsorship below, because a UK posting is
    # only reachable when the employer says out loud that they sponsor.
    - PL   # Poland (home)
    - NL   # Netherlands
    - ES   # Spain
    - DE   # Germany
    - IE   # Ireland
    - PT   # Portugal
    - DK   # Denmark
    - SE   # Sweden
    - FI   # Finland
    - "NO" # Norway — MUST stay quoted: YAML reads a bare NO as false
    - CH   # Switzerland
    - AT   # Austria
    - BE   # Belgium
    - FR   # France
    - IT   # Italy
    - EE   # Estonia
    - CZ   # Czechia
    - LU   # Luxembourg
  allow_remote: true
  # "Remote" with no European hint anywhere is usually a US role.
  remote_requires_eu_hint: true

  # Reachable only with the employer's help (Spanish national, UK needs a
  # sponsored visa): these pass ONLY when the posting explicitly offers
  # sponsorship — "visa sponsorship available", "we sponsor", and similar
  # offer-shaped phrasings. "Must have a valid work visa" is the opposite
  # sentence and does not count.
  countries_if_sponsorship:
    - GB

  # Drop postings whose description is not in a language you read. Judged on
  # the description only (a German title over an English body is an English
  # ad), only above language_min_chars (snippets are guesswork — in doubt,
  # the job stays), and the per-source drop counts land in the run log so a
  # whole country's volume can never vanish silently.
  languages:
    - en

  # Empty = allow any title. Whole-word, case-insensitive matching — so
  # "data scientist" also catches "Senior Data Scientist" (which the exclude
  # list then kills) and "Applied ML" catches "Applied ML Scientist". This
  # list is the shape of the search: DS/ML mid-level. Emptying it reopens
  # the gate to every title.
  title_include:
    - data scientist
    - data scientist i
    - data scientist ii
    - machine learning engineer
    - ml engineer
    - ai engineer
    - applied scientist
    - applied ml
    - analytics scientist
    - decision scientist

  # Stamped as raw["level"]="junior" when an included title carries one of
  # these — metadata for scoring/digest, never a gate. A plain "Data
  # Scientist" is NOT junior: mid is the target, junior is acceptable.
  title_junior_markers:
    - junior
    - associate
    - graduate
    - early career
    - entry level
  # This list REPLACES the shipped defaults rather than adding to them, so it
  # spells them all out. There is no stemming — "intern" does not catch
  # "internships" — and an EU search is not an English-language search, so the
  # entry-level words every local board uses are listed too. Whole-word
  # matching is what makes that safe: "intern" cannot hit "International",
  # "stage" cannot hit "Backstage".
  title_exclude:
    - intern
    - interns
    - internship
    - internships
    - apprentice
    - apprentices
    - apprenticeship
    - apprenticeships
    - graduate program
    - graduate programs
    - graduate programme
    - graduate programmes
    - graduate scheme
    - graduate schemes
    - working student
    - volunteer
    # German
    - werkstudent
    - praktikum
    - praktikant
    - praktikantin
    - ausbildung
    - auszubildende
    - azubi
    - duales studium
    # French
    - stage
    - stagiaire
    - alternance
    - alternant
    - apprentissage
    # Spanish / Portuguese
    - becario
    - becaria
    - practicas
    - estagio
    - estagiario
    # Dutch
    - stagiair
    - afstudeerstage
    # Polish
    - praktyki
    - praktykant
    - staz
    - stazysta
    # Italian
    - tirocinio
    - stagista
    # Seniority and roles outside the mid-level DS/ML target (Phase 4).
    # "manager" also kills "Data Science Manager" — deliberate: people
    # management is a different job. "research scientist" is the Samba TV
    # lesson: those loops want publication records, not production ML.
    - senior
    - sr
    - lead
    - staff
    - principal
    - head of
    - director
    - manager
    - phd
    - research scientist
  description_exclude:
    - security clearance
    - must be a us citizen
    - ts/sci
  # Read only from what the board states as structured data — Lever's
  # categories.commitment, Adzuna's contract_type — never from the title.
  # This catches the roles whose title is neutral but whose type is not.
  # `contract` and `freelance` are left OUT on purpose: plenty of real EU tech
  # work is contract, and a default that deletes jobs is the wrong kind of
  # opinionated. Uncomment them if you only want permanent roles.
  employment_type_exclude:
    - internship
    - intern
    - apprenticeship
    - apprentice
    # Personio states `trainee` as an employment type, and in the European
    # market it is the graduate-programme family that title_exclude above
    # already rules out in nine languages. It is here rather than there
    # because this list reads only what the board declares as structured
    # data — so it cannot mistake a role actually titled "Trainee Manager"
    # for a training position.
    - trainee
    - temporary
    - temp
    - seasonal
    - volunteer
    - work experience
    # - contract
    # - contractor
    # - freelance
  require_keywords_any: []
  min_description_chars: 0

scoring:
  # With provider: openrouter, model ids are vendor-qualified —
  # "anthropic/claude-sonnet-5", "openai/gpt-5", "google/gemini-2.5-pro".
  # A bare name is a 404 from OpenRouter; --validate-only catches that.
  model: anthropic/claude-sonnet-5   # anthropic/claude-haiku-4.5 is ~10x cheaper, blunter
  threshold: 65            # 65 medium · 75 strict
  max_jobs: 40             # hard cap on LLM calls per run — your cost ceiling
  max_tokens: 1500
  temperature: 0.0
  concurrency: 4

  # --- Phase 5: who is being scored, beyond what the CV says ---------------
  # All three are PROMPT-ONLY: they shape the model's judgement and never
  # touch threshold (65) or max_jobs (40).
  #
  # The positioning states what a CV structurally cannot: total experience
  # ("1.5 years" — the CV lists jobs, not a sum) and the honest gap.
  candidate_context: |
    Total experience: ~1.5 years as a Data Scientist (Uber: supply/driver
    forecasting for marketplace operations; Buynomics: revenue prediction and
    clustering for a Tier-1 CPG client). Strengths: tabular ML, time-series
    forecasting, LightGBM, SQL at scale, product analytics, causal inference
    and experimental design. Real gap: no deep NLP or LLM *research*
    experience — one production RAG project (thesis), no transformer
    fine-tuning, no publications.
  # Themes that should pull a score UP when the posting matches them.
  positive_signals:
    - time-series forecasting or demand planning
    - marketplace or operations analytics
    - experimentation, A/B testing
    - causal inference
  # Ceilings the model must respect, each one a lesson a real rejection
  # taught. Samba TV: interviewed, rejected for exactly this — an hour of
  # tailoring on such a loop is spent knowing the ending. The job still
  # reaches the digest (below threshold); it just stops costing evenings.
  score_caps:
    - when: "requires deep NLP research, LLM research, or transformer
        fine-tuning experience (not merely using LLM APIs or RAG)"
      cap: 60

tailoring:
  enabled: true
  model: anthropic/claude-sonnet-5
  max_per_run: 10
  max_tokens: 4000
  temperature: 0.2

apply:
  enabled: true
  # KEEP THIS TRUE for a few days. Dry run fills the form, screenshots it to
  # output/applications/<slug>/form_filled.png, and submits nothing.
  dry_run: true
  max_per_run: 5
  min_score: 80            # deliberately stricter than scoring.threshold
  headless: true
  timeout_seconds: 60
  require_pdf: true        # no tailored PDF -> digest instead of auto-apply

output:
  dir: output
  open_browser: true

db:
  path: output/tracker.sqlite3
  # Don't re-surface a job you've already been shown within this many days.
  # Jobs you actually applied to are never surfaced again, window or not.
  skip_seen_days: 30

notify:
  # A run that fetched nothing because every board 404'd produces the same
  # empty digest as a genuinely quiet Tuesday. This is what tells them apart.
  enabled: true
  # MUST stay quoted, for the same reason `"NO"` is quoted in filters.countries
  # above: YAML reads a bare `on` as the boolean true, so this whole list used
  # to land under a key named `True` and every edit to it was silently ignored.
  "on": [no_digest, missed_run, no_jobs, source_zero, all_sources_failed]
  channels:
    console: true          # stderr — ends up in run.log, and in cron's mail
    file: true             # output/ALERT.txt, deleted again when a run is healthy
    # Any command. Gets the message as its last argument, on stdin, and in
    # $JOBHUNTER_ALERT. Run without a shell, so job text can never be injected.
    #   macOS:  terminal-notifier -title "Job Hunter" -message
    #   Linux:  notify-send "Job Hunter"
    #   phone:  curl -d @- https://ntfy.sh/your-topic
    command: ""
    email: {}
      # to: you@example.com
      # from: you@example.com
      # smtp_host: smtp.gmail.com
      # smtp_port: 587
      # username: you@example.com
      # starttls: true
      # password comes from $JOBHUNTER_SMTP_PASSWORD, not from this file
  exit_nonzero: false      # true = a run with alerts exits 4, for schedulers

logging:
  level: INFO
