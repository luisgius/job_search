# Offline test suite on the oldest supported interpreter and the one the
# daily run uses (pyproject: requires-python >=3.10).
#
# Network tests are deselected by the repo's pytest addopts
# (-m 'not network'): nothing here calls a job board, an LLM provider or
# Gmail, and the job reads no secrets.
#
# Hardening, pinned by tests/test_workflow_hardening.py: actions are pinned to
# full commit SHAs (Dependabot bumps SHA and comment together), the token is
# read-only, and checkout does not leave it in .git/config for later steps.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
