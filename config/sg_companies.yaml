  robots_url: https://api.ashbyhq.com/robots.txt
  terms_url: https://developers.ashbyhq.com/docs/public-job-posting-api
  seed: true
  notes: 'Documented public job-posting API (developers.ashbyhq.com/docs/public-job-posting-api, updatedAt 2026-05-26:
    unauthenticated GET https://api.ashbyhq.com/posting-api/job-board/{JOB_BOARD_NAME}). api.ashbyhq.com/robots.txt
    returns HTTP 401, which RFC 9309 s2.3.1.3 classes as ''Unavailable'' (4xx): the crawler MAY access any resources.
    See robots_unavailable. This exception covers only an unavailable robots file on that path prefix. A robots
    5xx/network failure (s2.3.1.4 ''Unreachable'', MUST assume complete disallow), an actual Disallow rule, or a
    401/403/429/5xx on the job endpoint itself must fail closed. jobs.ashbyhq.com disallows /api/, but that is a
    different origin and is never called.'
  robots_unavailable:
    http_status: 401
    policy: documented_public_api
    path_prefix: /posting-api/job-board/
    documentation_url: https://developers.ashbyhq.com/docs/public-job-posting-api
    reference_url: https://www.rfc-editor.org/rfc/rfc9309.html#section-2.3.1.3
    verified_at: '2026-10-07'
  evidence:
    checked_at: '2026-10-07T15:05:10+00:00'
    http_status: 200
    endpoint: https://api.ashbyhq.com/posting-api/job-board/airwallex
